<title>Outlet Performance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
:root {
  --bg:       #f0f4f8;
  --surface:  #ffffff;
  --border:   #dde3ea;
  --fg:       #18212e;
  --fg-m:     #6b7a8d;
  --accent:   #2563eb;
  --bar-ok:   #2563eb;
  --bar-bad:  #e03333;
  --good:     #16a34a;
  --bad:      #e03333;
  --shadow:   0 1px 4px rgba(24,33,46,.08),0 0 0 1px rgba(24,33,46,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d1117;--surface:#161b22;--border:#2d3748;--fg:#e6edf3;--fg-m:#7d8fa3;
    --accent:#58a6ff;--bar-ok:#58a6ff;--bar-bad:#f87171;--good:#4ade80;--bad:#f87171;
    --shadow:0 1px 4px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0d1117;--surface:#161b22;--border:#2d3748;--fg:#e6edf3;--fg-m:#7d8fa3;
  --accent:#58a6ff;--bar-ok:#58a6ff;--bar-bad:#f87171;--good:#4ade80;--bad:#f87171;
  --shadow:0 1px 4px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;
  background:var(--bg);color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;min-height:100dvh;
}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-block:14px;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.125rem;font-weight:700;letter-spacing:-.025em}
.topbar-r{display:flex;align-items:center;gap:8px}
#ts{font-size:12px;color:var(--fg-m)}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:15px;color:var(--fg);transition:background .12s}
.icon-btn:hover{background:var(--border)}
.page{padding-block:20px;display:flex;flex-direction:column;gap:20px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--fg-m);cursor:pointer;font-size:13px;font-weight:600;transition:all .13s}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.kpi-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m)}
.kpi-val{font-size:2rem;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.kpi-val.accent{color:var(--accent)}.kpi-val.good{color:var(--good)}.kpi-val.bad{color:var(--bad)}
.section-hd{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:baseline;gap:6px}
.section-hd span{font-weight:400;color:var(--fg-m);font-size:13px}
.card{background:var(--surface);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.chart-legend{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-m)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chart-scroll{overflow-x:auto;padding-bottom:4px}
svg.bars{display:block;overflow:visible}
text.bar-pct{font-size:9px;fill:var(--fg-m)}
text.bar-week{font-size:9px;fill:var(--fg-m)}
text.bar-out{font-size:10px;font-weight:600;fill:var(--fg)}
text.y-lbl{font-size:10px;fill:var(--fg-m)}
.attn{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.attn-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);gap:12px}
.attn-row:last-child{border-bottom:none}
.attn-name{font-size:13px;font-weight:600}
.attn-week{font-size:12px;color:var(--fg-m)}
.attn-pct{font-size:13px;font-weight:700;color:var(--bad);white-space:nowrap;padding:3px 10px;border-radius:20px;background:rgba(224,51,51,.1)}
.empty{padding:20px;text-align:center;color:var(--fg-m);font-size:14px}
#state-loading{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--fg-m)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#main{display:none}
</style>

<div id="state-loading"><div class="spinner"></div><div>Loading…</div></div>

<div id="main">
  <header class="topbar">
    <h1>Outlet Performance</h1>
    <div class="topbar-r">
      <span id="ts"></span>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">🌓</button>
    </div>
  </header>
  <div class="page">
    <div class="filter-bar" role="group">
      <button class="pill active" data-o="All"      onclick="setFilter('All')">All outlets</button>
      <button class="pill"        data-o="Jurong"   onclick="setFilter('Jurong')">Jurong</button>
      <button class="pill"        data-o="Orchard"  onclick="setFilter('Orchard')">Orchard</button>
      <button class="pill"        data-o="Tampines" onclick="setFilter('Tampines')">Tampines</button>
    </div>
    <div class="kpi-grid" id="kpis"></div>
    <section>
      <div class="section-hd">Sales vs Target</div>
      <div class="card">
        <div class="chart-legend">
          <div class="leg"><div class="leg-dot" style="background:var(--bar-ok)"></div>≥ 90%</div>
          <div class="leg"><div class="leg-dot" style="background:var(--bar-bad)"></div>Below 90%</div>
          <div class="leg">
            <svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--fg-m)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
            90% line
          </div>
        </div>
        <div class="chart-scroll" id="chart"></div>
      </div>
    </section>
    <section>
      <div class="section-hd">Needs attention <span>below 90% of target, worst first</span></div>
      <div class="attn" id="attn"></div>
    </section>
  </div>
</div>

<script>
/* ── Config ── */
const SHEET_ID = '18AZX9R3IKOEVcUXKy4CwhbzSqoVeSExwepgOT4a4lqQ';
const TAB_NAME = 'Combined';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TAB_NAME)}`;

/* ── Snapshot (17 Aug – 12 Oct 2026) ── */
const SNAPSHOT = [
  {outlet:'Jurong',  week:'2026-08-17',sales:15500,target:15000,orders:519,returns:16, pct_of_target:1.033,returns_pct:0.031},
  {outlet:'Jurong',  week:'2026-08-24',sales:15100,target:15000,orders:516,returns:8,  pct_of_target:1.007,returns_pct:0.016},
  {outlet:'Jurong',  week:'2026-08-31',sales:16000,target:15000,orders:546,returns:8,  pct_of_target:1.067,returns_pct:0.015},
  {outlet:'Jurong',  week:'2026-09-07',sales:14200,target:15000,orders:488,returns:11, pct_of_target:0.947,returns_pct:0.023},
  {outlet:'Jurong',  week:'2026-09-14',sales:12600,target:15000,orders:430,returns:19, pct_of_target:0.840,returns_pct:0.044},
  {outlet:'Jurong',  week:'2026-09-21',sales:15300,target:15000,orders:512,returns:10, pct_of_target:1.020,returns_pct:0.020},
  {outlet:'Jurong',  week:'2026-09-28',sales:12900,target:15000,orders:454,returns:12, pct_of_target:0.860,returns_pct:0.026},
  {outlet:'Jurong',  week:'2026-10-05',sales:15500,target:15000,orders:542,returns:13, pct_of_target:1.033,returns_pct:0.024},
  {outlet:'Jurong',  week:'2026-10-12',sales:16100,target:15000,orders:551,returns:14, pct_of_target:1.073,returns_pct:0.025},
  {outlet:'Orchard', week:'2026-08-17',sales:24900,target:24000,orders:784,returns:24, pct_of_target:1.038,returns_pct:0.031},
  {outlet:'Orchard', week:'2026-08-24',sales:23500,target:24000,orders:743,returns:10, pct_of_target:0.979,returns_pct:0.013},
  {outlet:'Orchard', week:'2026-08-31',sales:21500,target:24000,orders:663,returns:10, pct_of_target:0.896,returns_pct:0.015},
  {outlet:'Orchard', week:'2026-09-07',sales:22500,target:24000,orders:690,returns:12, pct_of_target:0.938,returns_pct:0.017},
  {outlet:'Orchard', week:'2026-09-14',sales:20100,target:24000,orders:612,returns:21, pct_of_target:0.838,returns_pct:0.034},
  {outlet:'Orchard', week:'2026-09-21',sales:24800,target:24000,orders:742,returns:9,  pct_of_target:1.033,returns_pct:0.012},
  {outlet:'Orchard', week:'2026-09-28',sales:21500,target:24000,orders:656,returns:12, pct_of_target:0.896,returns_pct:0.018},
  {outlet:'Orchard', week:'2026-10-05',sales:23800,target:24000,orders:738,returns:15, pct_of_target:0.992,returns_pct:0.020},
  {outlet:'Orchard', week:'2026-10-12',sales:21400,target:24000,orders:659,returns:22, pct_of_target:0.892,returns_pct:0.033},
  {outlet:'Tampines',week:'2026-08-17',sales:17900,target:18000,orders:580,returns:11, pct_of_target:0.994,returns_pct:0.019},
  {outlet:'Tampines',week:'2026-08-24',sales:16100,target:18000,orders:544,returns:15, pct_of_target:0.894,returns_pct:0.028},
  {outlet:'Tampines',week:'2026-08-31',sales:19000,target:18000,orders:618,returns:14, pct_of_target:1.056,returns_pct:0.023},
  {outlet:'Tampines',week:'2026-09-07',sales:18400,target:18000,orders:612,returns:9,  pct_of_target:1.022,returns_pct:0.015},
  {outlet:'Tampines',week:'2026-09-14',sales:16100,target:18000,orders:540,returns:14, pct_of_target:0.894,returns_pct:0.026},
  {outlet:'Tampines',week:'2026-09-21',sales:19200,target:18000,orders:640,returns:8,  pct_of_target:1.067,returns_pct:0.013},
  {outlet:'Tampines',week:'2026-09-28',sales:15200,target:18000,orders:498,returns:12, pct_of_target:0.844,returns_pct:0.024},
  {outlet:'Tampines',week:'2026-10-05',sales:15200,target:18000,orders:498,returns:13, pct_of_target:0.844,returns_pct:0.026},
  {outlet:'Tampines',week:'2026-10-12',sales:17500,target:18000,orders:574,returns:15, pct_of_target:0.972,returns_pct:0.026},
];

let ALL = [], activeFilter = 'All';

/* ── Theme ── */
(function(){try{const t=localStorage.getItem('op-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(_){}})();
function toggleTheme(){
  const r=document.documentElement, cur=r.getAttribute('data-theme');
  const nxt=cur==='dark'?'light':cur==='light'?'dark':matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark';
  r.setAttribute('data-theme',nxt);
  try{localStorage.setItem('op-theme',nxt)}catch(_){}
}

/* ── CSV parser ── */
function parseCSV(txt){
  const out=[];let row=[],cur='',inq=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(inq){if(c==='"'&&txt[i+1]==='"'){cur+='"';i++}else if(c==='"')inq=false;else cur+=c}
    else if(c==='"')inq=true;
    else if(c===','){row.push(cur.trim());cur=''}
    else if(c==='\n'||(c==='\r'&&txt[i+1]==='\n')){
      if(c==='\r')i++;row.push(cur.trim());cur='';
      if(row.some(v=>v!==''))out.push(row);row=[];
    }else cur+=c;
  }
  if(cur||row.length){row.push(cur.trim());if(row.some(v=>v))out.push(row)}
  return out;
}

/* ── Load ── */
async function boot(){
  try{
    const res=await Promise.race([fetch(CSV_URL),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000))]);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=parseCSV(await res.text());
    if(rows.length<2)throw new Error('no rows');
    const hdr=rows[0].map(h=>h.toLowerCase().replace(/\s+/g,'_'));
    ALL=rows.slice(1).map(r=>{
      const o={};
      hdr.forEach((h,i)=>{
        let v=(r[i]??'').replace(/,/g,'');
        if(v.endsWith('%'))v=String(parseFloat(v)/100);
        o[h]=(v!==''&&!isNaN(+v))?+v:v;
      });
      return o;
    }).filter(r=>r.outlet);
    document.getElementById('ts').textContent='Live · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }catch(_){
    ALL=SNAPSHOT;
    document.getElementById('ts').textContent='Snapshot · 15 Oct 2026';
  }
  document.getElementById('state-loading').hidden=true;
  document.getElementById('main').style.display='block';
  render();
}

/* ── Filter ── */
function setFilter(o){
  activeFilter=o;
  document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',b.dataset.o===o));
  render();
}
function rows(){return activeFilter==='All'?ALL:ALL.filter(r=>r.outlet===activeFilter)}

/* ── Helpers ── */
const money=n=>isNaN(n)?'—':'S$'+Math.round(n).toLocaleString('en-SG');
const cnt=n=>isNaN(n)?'—':Math.round(n).toLocaleString('en-SG');
const pct=(n,d=1)=>isNaN(n)?'—':(n*100).toFixed(d)+'%';
function fmtWeek(w){
  if(!w)return'';
  const d=new Date(w);
  if(isNaN(d))return String(w).slice(0,6);
  return d.getDate()+' '+d.toLocaleString('en-GB',{month:'short'});
}

function render(){kpis();chart();attn()}

/* ── KPIs ── */
function kpis(){
  const R=rows();
  const sales=R.reduce((s,r)=>s+(r.sales||0),0);
  const target=R.reduce((s,r)=>s+(r.target||0),0);
  const orders=R.reduce((s,r)=>s+(r.orders||0),0);
  const returns=R.reduce((s,r)=>s+(r.returns||0),0);
  const pOfT=target?sales/target:0;
  const retPct=orders?returns/orders:0;
  document.getElementById('kpis').innerHTML=[
    {lbl:'Total Sales',   val:money(sales),  cls:'accent'},
    {lbl:'% of Target',   val:pct(pOfT),     cls:pOfT>=.9?'good':'bad'},
    {lbl:'Total Orders',  val:cnt(orders),   cls:'accent'},
    {lbl:'Returns Rate',  val:pct(retPct),   cls:retPct<=.05?'good':'bad'},
  ].map(k=>`<div class="kpi"><div class="kpi-lbl">${k.lbl}</div><div class="kpi-val ${k.cls}">${k.val}</div></div>`).join('');
}

/* ── Chart ── */
function chart(){
  const R=[...rows()].sort((a,b)=>{
    if(a.outlet<b.outlet)return -1;if(a.outlet>b.outlet)return 1;
    return String(a.week||'').localeCompare(String(b.week||''),undefined,{numeric:true});
  });
  if(!R.length){document.getElementById('chart').innerHTML='<div class="empty">No data.</div>';return}

  const BW=34,GAP=7,PADL=40,PADR=12,PADT=24,H=180;
  const maxV=Math.max(1.3,...R.map(r=>r.pct_of_target||0));
  const W=PADL+R.length*(BW+GAP)-GAP+PADR;
  const svgH=PADT+H+52;
  const yS=v=>PADT+H-(v/maxV)*H;
  const refY=yS(0.9);

  const ticks=[0,.5,1,1.5].filter(t=>t<=maxV+.05);
  const grid=ticks.map(t=>{const y=yS(t);return(
    `<line x1="${PADL}" y1="${y}" x2="${PADL+R.length*(BW+GAP)-GAP}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity=".7"/>` +
    `<text class="y-lbl" x="${PADL-8}" y="${y+3.5}" text-anchor="end">${(t*100).toFixed(0)}%</text>`
  )}).join('');

  const seps=[]; R.forEach((r,i)=>{
    if(i>0&&R[i-1].outlet!==r.outlet){
      const sx=PADL+i*(BW+GAP)-GAP/2;
      seps.push(`<line x1="${sx}" y1="${PADT-18}" x2="${sx}" y2="${PADT+H}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 2"/>`);
    }
  });

  const bars=R.map((r,i)=>{
    const x=PADL+i*(BW+GAP);
    const val=r.pct_of_target||0;
    const bH=Math.max(2,(val/maxV)*H);
    const bY=PADT+H-bH;
    const col=val>=.9?'var(--bar-ok)':'var(--bar-bad)';
    const isFirst=i===0||R[i-1].outlet!==r.outlet;
    const outLbl=isFirst?`<text class="bar-out" x="${x+BW/2}" y="${PADT-10}" text-anchor="middle">${r.outlet}</text>`:'';
    return `${outLbl}
    <rect x="${x}" y="${bY}" width="${BW}" height="${bH}" fill="${col}" rx="3"/>
    <text class="bar-pct"  x="${x+BW/2}" y="${bY-3}" text-anchor="middle">${(val*100).toFixed(0)}%</text>
    <text class="bar-week" x="${x+BW/2}" y="${PADT+H+14}" text-anchor="middle">${fmtWeek(r.week)}</text>`;
  }).join('');

  document.getElementById('chart').innerHTML=`<svg class="bars" width="${W}" height="${svgH}" role="img" aria-label="Sales vs target">
    ${grid}${seps.join('')}${bars}
    <line x1="${PADL}" y1="${refY}" x2="${PADL+R.length*(BW+GAP)-GAP}" y2="${refY}" stroke="var(--fg-m)" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text class="y-lbl" x="${PADL-8}" y="${refY-4}" text-anchor="end" font-weight="600">90%</text>
  </svg>`;
}

/* ── Attention ── */
function attn(){
  const bad=rows().filter(r=>(r.pct_of_target||0)<.9).sort((a,b)=>(a.pct_of_target||0)-(b.pct_of_target||0));
  const el=document.getElementById('attn');
  if(!bad.length){el.innerHTML='<div class="empty">✅ All outlet-weeks are at or above 90% of target.</div>';return}
  el.innerHTML=bad.map(r=>`<div class="attn-row">
    <div><div class="attn-name">${r.outlet}</div><div class="attn-week">w/c ${fmtWeek(r.week)}</div></div>
    <div class="attn-pct">${pct(r.pct_of_target)} of target</div>
  </div>`).join('');
}

boot();
</script>
